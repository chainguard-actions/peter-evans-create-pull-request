name: Test add-paths input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create file changes including one that should be excluded
        run: |
          echo "included file $(date)" > included-file.txt
          echo "excluded file $(date)" > excluded-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          title: 'Test PR with add-paths filter'
          body: 'This PR should only include the specified path.'
          branch: 'test/create-pull-request-add-paths'
          commit-message: 'test: add only included-file.txt'
          add-paths: 'included-file.txt'

      - name: Assert action ran with add-paths filter or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_URL: ${{ steps.action.outputs.pull-request-url }}
          PR_OP: ${{ steps.action.outputs.pull-request-operation }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-url: $PR_URL"
          echo "pull-request-operation: $PR_OP"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "FAIL: action succeeded but pull-request-number is empty"
              exit 1
            fi
            if [ -z "$PR_URL" ]; then
              echo "FAIL: action succeeded but pull-request-url is empty"
              exit 1
            fi
            echo "PASS: PR created with add-paths filter, number=$PR_NUMBER op=$PR_OP"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
