name: Test path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a subdirectory repo for path input
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sub-repo"
          cd "$GITHUB_WORKSPACE/sub-repo"
          git init
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "hello" > file.txt
          git add file.txt
          git commit -m "initial commit"
          # Make a change so there's something to commit
          echo "world" >> file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          path: sub-repo
          branch: create-pull-request/test-path
          title: 'Test path input'
          body: 'Testing the path input'
          commit-message: 'test: path input change'

      - name: Assert action ran (path input accepted, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_URL: ${{ steps.action.outputs.pull-request-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-url: $PR_URL"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
