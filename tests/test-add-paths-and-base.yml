name: Test add-paths and base inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create file changes
        run: |
          echo "add-paths test $(date)" > add-paths-test.txt
          echo "other file $(date)" > other-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          add-paths: add-paths-test.txt
          base: act-harness
          title: 'Test PR - add-paths and base inputs'
          body: 'Automated test covering add-paths and base inputs'
          branch: 'test/add-paths-and-base'
          commit-message: 'test: add add-paths test file'

      - name: Assert action ran gracefully with add-paths and base inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_OP: ${{ steps.action.outputs.pull-request-operation }}
          PR_SHA: ${{ steps.action.outputs.pull-request-head-sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-operation: $PR_OP"
          echo "pull-request-head-sha: $PR_SHA"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "FAIL: action succeeded but pull-request-number is empty"
              exit 1
            fi
            if [ -z "$PR_SHA" ]; then
              echo "FAIL: action succeeded but pull-request-head-sha is empty"
              exit 1
            fi
            echo "PASS: PR $PR_OP with number $PR_NUMBER and SHA $PR_SHA"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
