name: Test create-pull-request - with file changes
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a file change
        run: |
          echo "test change $(date)" > tests/test-artifact.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          branch: test/with-changes
          title: 'Test PR - with changes'
          body: 'Automated test PR with file changes'
          commit-message: 'test: add test artifact'
          add-paths: tests/test-artifact.txt

      - name: Assert action ran and handled changes gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_URL: ${{ steps.action.outputs.pull-request-url }}
          PR_OP: ${{ steps.action.outputs.pull-request-operation }}
          PR_SHA: ${{ steps.action.outputs.pull-request-head-sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-url: $PR_URL"
          echo "pull-request-operation: $PR_OP"
          echo "pull-request-head-sha: $PR_SHA"
          if [ "$OUTCOME" = "success" ]; then
            # If the action succeeded, it should have created a PR with outputs set
            if [ -z "$PR_NUMBER" ]; then
              echo "FAIL: action succeeded but pull-request-number is empty"
              exit 1
            fi
            if [ -z "$PR_URL" ]; then
              echo "FAIL: action succeeded but pull-request-url is empty"
              exit 1
            fi
            if [ -z "$PR_OP" ]; then
              echo "FAIL: action succeeded but pull-request-operation is empty"
              exit 1
            fi
            echo "PASS: PR created with number=$PR_NUMBER, operation=$PR_OP"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
