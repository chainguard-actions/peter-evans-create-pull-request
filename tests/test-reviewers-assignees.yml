name: Test reviewers and assignees inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a test file change
        run: |
          echo "test change for reviewers/assignees" >> hardened/tests/reviewers-test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          branch: create-pull-request/reviewers-test
          title: "Test reviewers and assignees"
          body: "Testing reviewers, assignees, team-reviewers, and milestone inputs"
          commit-message: "test: reviewers and assignees coverage"
          assignees: octocat
          reviewers: octocat
          team-reviewers: maintainers
          milestone: 1

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_OP: ${{ steps.action.outputs.pull-request-operation }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-operation: $PR_OP"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
