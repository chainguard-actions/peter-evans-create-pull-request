name: Test PR metadata inputs (assignees, milestone, reviewers, team-reviewers, push-to-fork)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Make a change to trigger PR creation
        run: |
          echo "test-metadata-$(date +%s)" >> test-metadata.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          branch: create-pull-request/test-metadata
          title: 'Test PR metadata inputs'
          body: 'Testing assignees, milestone, reviewers, team-reviewers, push-to-fork inputs'
          commit-message: 'test: PR metadata inputs'
          assignees: octocat
          reviewers: octocat
          team-reviewers: justice-league
          milestone: 1
          push-to-fork: ''

      - name: Assert action ran (metadata inputs accepted, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_URL: ${{ steps.action.outputs.pull-request-url }}
          PR_OP: ${{ steps.action.outputs.pull-request-operation }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-url: $PR_URL"
          echo "pull-request-operation: $PR_OP"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with metadata inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
