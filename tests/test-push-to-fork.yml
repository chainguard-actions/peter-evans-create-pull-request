name: Test push-to-fork input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - name: Create a file change
        run: |
          echo "push-to-fork test $(date)" > push-to-fork-test.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          push-to-fork: ${{ github.repository }}
          title: 'Test PR - push-to-fork input'
          body: 'Automated test covering push-to-fork input'
          branch: 'test/push-to-fork'
          commit-message: 'test: add push-to-fork test file'

      - name: Assert action ran gracefully with push-to-fork input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_OP: ${{ steps.action.outputs.pull-request-operation }}
          PR_SHA: ${{ steps.action.outputs.pull-request-head-sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-operation: $PR_OP"
          echo "pull-request-head-sha: $PR_SHA"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "FAIL: action succeeded but pull-request-number is empty"
              exit 1
            fi
            if [ -z "$PR_SHA" ]; then
              echo "FAIL: action succeeded but pull-request-head-sha is empty"
              exit 1
            fi
            echo "PASS: PR $PR_OP with number $PR_NUMBER and SHA $PR_SHA"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or fork not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
