name: Test create-pull-request with body-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create PR body file and a file change
        run: |
          cat > /tmp/pr-body.md << 'EOF'
          ## Test Pull Request

          This PR was created by the automated test suite.

          ### Changes
          - Added a test artifact file

          ### Notes
          - This is a test of the `body-path` input
          EOF
          echo "body-path-test-$(date +%s)" > tests/test-body-path-artifact.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          branch: create-pull-request/test-body-path
          title: 'Test PR - body from file'
          body-path: /tmp/pr-body.md
          commit-message: 'test: body-path input test'
          add-paths: tests/test-body-path-artifact.txt

      - name: Assert action ran with body-path input
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_URL: ${{ steps.action.outputs.pull-request-url }}
          PR_OP: ${{ steps.action.outputs.pull-request-operation }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-url: $PR_URL"
          echo "pull-request-operation: $PR_OP"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "FAIL: action succeeded but pull-request-number is empty"
              exit 1
            fi
            if [ -z "$PR_OP" ]; then
              echo "FAIL: action succeeded but pull-request-operation is empty"
              exit 1
            fi
            echo "PASS: PR created/updated with number=$PR_NUMBER op=$PR_OP"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Clean up test artifact
        if: always()
        run: rm -f tests/test-body-path-artifact.txt
