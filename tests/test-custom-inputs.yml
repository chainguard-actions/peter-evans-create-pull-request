name: Test create-pull-request - custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure git identity
        run: |
          git config user.email "ci@example.com"
          git config user.name "CI Bot"

      - name: Create a file change for the PR
        run: |
          mkdir -p tests/custom-test-dir
          echo "custom test content $(date)" > tests/custom-test-dir/custom-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          branch: test/custom-inputs-branch
          branch-suffix: timestamp
          base: act-harness
          title: 'Custom Title: Automated Test PR'
          body: |
            This is a custom body for the test PR.
            It spans multiple lines.
          commit-message: 'chore: custom commit message for test'
          committer: 'CI Bot <ci@example.com>'
          author: 'CI Bot <ci@example.com>'
          signoff: true
          draft: false
          labels: |
            test
            automated
          add-paths: tests/custom-test-dir/custom-file.txt

      - name: Assert action ran with custom inputs gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_URL: ${{ steps.action.outputs.pull-request-url }}
          PR_OP: ${{ steps.action.outputs.pull-request-operation }}
          PR_SHA: ${{ steps.action.outputs.pull-request-head-sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-url: $PR_URL"
          echo "pull-request-operation: $PR_OP"
          echo "pull-request-head-sha: $PR_SHA"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "FAIL: action succeeded but pull-request-number is empty"
              exit 1
            fi
            if [ -z "$PR_URL" ]; then
              echo "FAIL: action succeeded but pull-request-url is empty"
              exit 1
            fi
            if [ "$PR_OP" != "created" ] && [ "$PR_OP" != "updated" ]; then
              echo "FAIL: unexpected pull-request-operation '$PR_OP'"
              exit 1
            fi
            echo "PASS: PR $PR_OP with number=$PR_NUMBER"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
