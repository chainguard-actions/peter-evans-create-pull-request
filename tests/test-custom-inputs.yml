name: Test custom inputs - draft PR with custom committer and add-paths
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create specific files to commit via add-paths
        run: |
          mkdir -p custom-output
          echo "custom file content $(date)" > custom-output/result.txt
          echo "another file that should NOT be committed" > should-not-commit.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          title: 'Draft PR with custom inputs'
          body: 'Testing custom committer, author, draft mode, and add-paths.'
          branch: 'test/create-pull-request-custom'
          commit-message: 'test: add custom output file'
          committer: 'Test Bot <testbot@example.com>'
          author: 'Test Author <testauthor@example.com>'
          add-paths: 'custom-output/result.txt'
          draft: 'true'
          labels: 'automated,test'

      - name: Assert action ran with custom inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_URL: ${{ steps.action.outputs.pull-request-url }}
          PR_OP: ${{ steps.action.outputs.pull-request-operation }}
          PR_BRANCH: ${{ steps.action.outputs.pull-request-branch }}
          PR_SHA: ${{ steps.action.outputs.pull-request-head-sha }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-url: $PR_URL"
          echo "pull-request-operation: $PR_OP"
          echo "pull-request-branch: $PR_BRANCH"
          echo "pull-request-head-sha: $PR_SHA"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "FAIL: action succeeded but pull-request-number is empty"
              exit 1
            fi
            if [ -z "$PR_BRANCH" ]; then
              echo "FAIL: action succeeded but pull-request-branch is empty"
              exit 1
            fi
            if [ "$PR_BRANCH" != "test/create-pull-request-custom" ]; then
              echo "FAIL: expected branch 'test/create-pull-request-custom', got '$PR_BRANCH'"
              exit 1
            fi
            echo "PASS: PR $PR_OP with number $PR_NUMBER on branch $PR_BRANCH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable on GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
