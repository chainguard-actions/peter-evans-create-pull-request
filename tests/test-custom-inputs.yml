name: Test custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple file changes
        run: |
          mkdir -p test-dir
          echo "file one content $(date)" > test-dir/file1.txt
          echo "file two content $(date)" > test-dir/file2.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          title: 'Custom Title: Automated Test PR'
          body: 'Custom body for the test pull request with multiple files.'
          branch: 'test/create-pull-request-custom'
          base: 'act-harness'
          commit-message: 'test: add multiple test files'
          committer: 'Test Bot <testbot@example.com>'
          author: 'Test Author <testauthor@example.com>'
          add-paths: |
            test-dir/file1.txt
            test-dir/file2.txt
          draft: false
          delete-branch: false
          maintainer-can-modify: true

      - name: Assert action ran with custom inputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_URL: ${{ steps.action.outputs.pull-request-url }}
          PR_OP: ${{ steps.action.outputs.pull-request-operation }}
          PR_HEAD_SHA: ${{ steps.action.outputs.pull-request-head-sha }}
          PR_BRANCH: ${{ steps.action.outputs.pull-request-branch }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-url: $PR_URL"
          echo "pull-request-operation: $PR_OP"
          echo "pull-request-head-sha: $PR_HEAD_SHA"
          echo "pull-request-branch: $PR_BRANCH"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PR_NUMBER" ]; then
              echo "FAIL: action succeeded but pull-request-number is empty"
              exit 1
            fi
            if [ -z "$PR_HEAD_SHA" ]; then
              echo "FAIL: action succeeded but pull-request-head-sha is empty"
              exit 1
            fi
            if [ "$PR_BRANCH" != "test/create-pull-request-custom" ]; then
              echo "FAIL: expected branch 'test/create-pull-request-custom' but got '$PR_BRANCH'"
              exit 1
            fi
            echo "PASS: PR created with custom inputs, number=$PR_NUMBER branch=$PR_BRANCH"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
